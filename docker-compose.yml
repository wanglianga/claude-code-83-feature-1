services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-haircut}
      POSTGRES_USER: ${POSTGRES_USER:-haircut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haircut123}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal
    # 数据库不发布到宿主端口，仅 compose 内部网络互访

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-haircut}
      DB_USER: ${POSTGRES_USER:-haircut}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-haircut123}
      JWT_SECRET: ${JWT_SECRET:-community-haircut-platform-jwt-secret-key-2026}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-12}
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    # 后端不直接发布到宿主，由前端 nginx 反向代理 /api

  frontend:
    build: ./frontend
    ports:
      - "${CC_PUBLISH_PORT:-3083}:8080"
    depends_on:
      - backend
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
