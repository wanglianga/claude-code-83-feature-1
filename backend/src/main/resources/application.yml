server:
  port: 8080

spring:
  application:
    name: haircut-platform
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:haircut}
    username: ${DB_USER:haircut}
    password: ${DB_PASSWORD:haircut123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    time-zone: Asia/Shanghai

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt-secret: ${JWT_SECRET:community-haircut-platform-jwt-secret-key-2026}
  jwt-expire-hours: ${JWT_EXPIRE_HOURS:12}
